# Member weight: an operational default (0.40), not an independently
# validated best value -- see WEIGHTS.md. Change this single value to test a
# different weight; the remaining 3 members always split (1 - weight) equally.
weight_resnet50_320: 0.40

# Stochastic (dropout-on) passes per member. Every pass votes for one class;
# the prediction is the weighted plurality and the uncertainty is the share of
# votes that disagree with it. More passes give steadier votes at linear cost.
mc_samples: 20

# An instance whose uncertainty reaches this value is one temporal tracking is
# meant for (Prediction.needs_tracking). 0.09 tracks 29.1% of the official
# test set; 0.20 tracks 18.4% at a slightly lower accuracy (0.9581 vs 0.9623).
# 0.09 was chosen on that test set, so its accuracy is optimistic -- see the
# README's "Temporal tracking" section.
uncertainty_gate: 0.09

members:
  - checkpoint: weights/resnet50_320_dropout.pt
    model: resnet50_deepdropout
    image_size: 320
    letterbox: true
    label: resnet50_320
  - checkpoint: weights/resnet50_224_dropout.pt
    model: resnet50_deepdropout
    image_size: 224
    letterbox: true
    label: resnet50_224
  - checkpoint: weights/mobilenet_baseline_dropout.pt
    model: mobilenet_v3_small_deepdropout
    image_size: 224
    letterbox: false
    label: baseline
  - checkpoint: weights/mobilenet_letterbox_dropout.pt
    model: mobilenet_v3_small_deepdropout
    image_size: 224
    letterbox: true
    label: letterbox_crop
